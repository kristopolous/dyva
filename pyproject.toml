[project]
name = "dyva"
version = "0.6.8"
description = "OpenAI-compatible proxy that routes to free Ollama servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "aiodns>=3.2.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "curl_cffi>=0.7.0",
    "curlify>=3.0.0",
    "aiohttp-swagger3>=0.10.0",
    "Pillow>=10.0.0",
    "maxminddb>=2.0.0",
    "tiktoken>=0.7.0",
    "rjsmin>=1.2.0",
    "rcssmin>=1.1.0",
    "aiohttp-socks>=0.12.0",
]

[project.optional-dependencies]
# Semantic chat/doc history search. No wheel on some platforms (e.g. armv7l);
# absent, the code falls back to keyword search — so it's optional, not required.
search = ["sqlite-vec>=0.1.9"]
# Voice-catalog cloning: fish reference audio is passed as raw bytes via msgpack.
# Absent, catalog voices fall back to the host default voice — so it's optional too.
voice = ["msgpack>=1.0.0"]

[tool.setuptools]
include-package-data = true
packages = ["dyva", "dyva.static", "graflex"]

[tool.setuptools.package-data]
dyva = ["static/*", "*.json", "voices/*"]
graflex = ["*.json"]

[project.scripts]
dyva = "dyva:main"
graflex = "graflex:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
